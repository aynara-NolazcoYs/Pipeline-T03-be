spring:
  application:
    name: DonAlfonso
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=${DB_NAME:DonAlfonsoDB};encrypt=false;trustServerCertificate=true
    username: ${DB_USER:master}
    password: ${DB_PASSWORD:StrongPass123$}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: never

server:
  port: 8080
