server:
  port: ${PORT:5001}  # Valor por defecto si PORT no está configurado
  url: ${SERVER_URL:http://localhost:8080}  # Valor por defecto si SERVER_URL no está configurado
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=DonAlfonso;encrypt=true;trustServerCertificate=true 
    username: sa 
    password: Pierojsm1512* 
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update  # Puede ser 'create', 'update', 'validate' o 'none'
    show-sql: false  # Puede true o false, para ver las consultas SQL en consola

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html # Ruta para acceder a Swagger UI: http://localhost:8080/swagger-ui.html