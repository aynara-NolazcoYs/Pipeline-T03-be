version: '3'

services:
  sqlserver:
    image: aynaranolazco/sql-server:2022
    container_name: sql-server
    environment:
      SA_PASSWORD: "Admin12345"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    networks:
      - my-network

networks:
  my-network:
    name: my-network
    driver: bridge